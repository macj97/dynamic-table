<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Dynamic Multiplication Table</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Dynamic Multiplication Table</h1>

        <div id="Form">
            <h2>Please enter the table ranges.</h2>
            <form>
                <label for="mincolval">Minimum Column Value:</label>
                <input type="text" id="mincolval" name="mincolval" required autofocus><br>
                <label for="maxcolval">Maximum Column Value:</label>
                <input type="text" id="maxcolval" name="maxcolval" required><br>
                <label for="minrowval">Minimum Row Value:</label>
                <input type="text" id="minrowval" name="minrowval" required><br>
                <label for="maxrowval">Maximum Row Value:</label>
                <input type="text" id="maxrowval" name="maxrowval" required><br>
                <input type="submit">
                <input type="reset" value="Reset"><br>
            </form>
        </div>

        <div id="Table">
        </div>

        <script src="script.js"></script>
    </body>
</html>
