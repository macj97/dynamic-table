<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Dynamic Multiplication Table</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Dynamic Multiplication Table</h1>

        <div id="Form">
            <h2>Please enter the table ranges.</h2>
            <form>
                <label for="mincolval">Minimum Column Value:</label>
                <input type="number" id="mincolval" name="mincolval" 
                    value="0" min="-50" max="50" required autofocus><br>
                <label for="maxcolval">Maximum Column Value:</label>
                <input type="number" id="maxcolval" name="maxcolval"
                    value="4" min="-50" max="50" required><br>
                <label for="minrowval">Minimum Row Value:</label>
                <input type="number" id="minrowval" name="minrowval"
                    value="0" min="-50" max="50" required><br>
                <label for="maxrowval">Maximum Row Value:</label>
                <input type="number" id="maxrowval" name="maxrowval"
                    value="4" min="-50" max="50" required><br>
                <input type="submit">
                <input type="reset" value="Reset"><br>
            </form>
        </div>

        <div id="Table">
            <table>
                <tr>
                    <th class="hide-cell"></th>
                    <th>0</th>
                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>4</th>
                </tr>
                <tr>
                    <th>0</th>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>1</th>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>2</th>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>3</th>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>4</th>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>

        <!-- <script src="script.js"></script> -->
    </body>
</html>
